version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci # or npm install if you prefer
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist # or "build", depends on webpack.config.js output
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
